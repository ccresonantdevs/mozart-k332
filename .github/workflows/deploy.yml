name: Deploy VitePress site to Pages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Exact version tag to deploy (e.g., v0.1.0)'
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Determine and Validate Target Tag
        id: tag_info
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            RAW_TAG="$INPUT_TAG"
          else
            RAW_TAG="$REF_NAME"
          fi

          # Validate strict ^v[0-9]+\.[0-9]+\.[0-9]+$ before output/use
          if ! echo "$RAW_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version tag format: '$RAW_TAG'. Must match ^v[0-9]+\.[0-9]+\.[0-9]+$"
            exit 1
          fi

          echo "validated_tag=$RAW_TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout Exact Tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.tag_info.outputs.validated_tag }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Validate Tag Resolves to HEAD and Matches package.json
        env:
          TARGET_TAG: ${{ steps.tag_info.outputs.validated_tag }}
        run: |
          # Verify tag resolves to checked-out HEAD
          TAG_COMMIT=$(git rev-parse -q --verify "refs/tags/${TARGET_TAG}^{commit}")
          HEAD_COMMIT=$(git rev-parse HEAD)
          echo "Tag commit:  $TAG_COMMIT"
          echo "HEAD commit: $HEAD_COMMIT"
          if [ -z "$TAG_COMMIT" ] || [ "$TAG_COMMIT" != "$HEAD_COMMIT" ]; then
            echo "::error::Tag $TARGET_TAG does not resolve to checked-out HEAD"
            exit 1
          fi

          # Verify tag matches package.json version
          PKG_VERSION=$(node -p "require('./package.json').version")
          EXPECTED_TAG="v${PKG_VERSION}"
          echo "Target tag:   $TARGET_TAG"
          echo "Expected tag: $EXPECTED_TAG"
          if [ "$TARGET_TAG" != "$EXPECTED_TAG" ]; then
            echo "::error::Tag mismatch: $TARGET_TAG does not match package.json v$PKG_VERSION"
            exit 1
          fi
          echo "Tag validation and HEAD resolution passed."

      - name: Install dependencies (deterministic npm ci)
        run: npm ci

      - name: Build with VitePress
        run: npm run docs:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
